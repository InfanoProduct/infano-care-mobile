name: infano_care_mobile
description: "Infano.Care — Your Journey. Your Power. Your Safe Space."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  flutter_bloc: ^9.1.0
  provider: ^6.1.1
  equatable: ^2.0.5
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.8.0+1

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.3.3+1
  connectivity_plus: ^6.1.1
  path: ^1.9.1
  path_provider: ^2.1.5
  collection: ^1.18.0

  # UI & Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  page_flip: ^0.2.5+1
  youtube_player_flutter: ^9.1.1

  # Animations
  lottie: ^3.3.1
  table_calendar: ^3.1.2

  # SVG
  flutter_svg: ^2.0.17

  # OTP input
  pin_code_fields: ^8.0.1
  sms_autofill: ^2.4.0
  permission_handler: ^12.0.1
  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.2
  flutter_local_notifications: ^21.0.0

  # Date formatting
  intl: ^0.20.2
  flutter_native_splash: ^2.4.4
  share_plus: ^10.1.4

  # Functional programming
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  socket_io_client: ^3.1.4
  jwt_decoder: ^2.0.1
  encrypt: ^5.0.3
  confetti: ^0.8.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_card_swiper: ^7.2.0
  dart_geohash: ^2.1.0
  image_picker: ^1.2.1
  image_cropper: ^12.2.1
  record: ^6.2.0
  audioplayers: ^6.6.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.9.3
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon-with-bg.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon-without-bg.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo_splash.png
  android: true
  ios: true
  android_gravity: center
  android_12:
    image: assets/logo_splash.png
    color: "#ffffff"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_padded.png
    - assets/logo_splash.png
    - assets/icon-with-bg.png
    - assets/icon-without-bg.png
    - assets/images/
    - assets/images/gigi.png
    - assets/images/gigi_avatar.png
    - assets/images/maya.png
    - assets/images/hook.jpeg
    - assets/images/community_banner.png
    - assets/images/period_onboarding.png
    - assets/images/book/
